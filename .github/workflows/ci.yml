name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/triageops/ --ignore-missing-imports
        continue-on-error: true  # non-blocking for now

      - name: Run unit tests (no API key needed)
        run: pytest tests/test_safety.py tests/test_schemas.py tests/test_pipeline_mock.py tests/test_api_and_fallback.py -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t triageops:ci .

      - name: Test container starts
        run: |
          docker run --rm -d --name triageops-test \
            -e GOOGLE_CLOUD_PROJECT=test-project \
            -p 8000:8000 \
            triageops:ci
          sleep 5
          # Check if process started (health endpoint may fail without real creds)
          docker ps | grep triageops-test
          docker stop triageops-test
